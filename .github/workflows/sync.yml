name: Sync from Doubao

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub 允许的最快频率，5 分钟一次
  workflow_dispatch: # 也可以在 Actions 页面手动点一下立即同步

permissions:
  contents: write

concurrency:
  group: sync-from-doubao
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and clean latest page
        run: python3 scripts/sync.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "页面没有变化，跳过提交"
            exit 0
          fi
          git config user.name "doubao-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync from Doubao: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
